name: Publit
options:
  bundleIdPrefix: io.github.publit
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, de, fr, it, es, pt-PT, nl, pl, uk, ro, cs, sv, el, hu, tr]
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "44"
    # Personal Team — Automatic Signing for local device installs.
    DEVELOPMENT_TEAM: "3D6S8GFSGK"
packages:
  # Google's map, used instead of Apple's when chosen in Settings and an API key is set.
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 11.2.0
targets:
  Publit:
    type: application
    platform: iOS
    sources:
      - Sources
      # Render the real widget view in DEBUG-only UI QA.
      - Widgets/DeparturesWidget.swift
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Publit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Publit uses your location to show departures near you and to plan trips from where you are.
        NSMotionUsageDescription: Publit reads your walking speed from the step counter, only if you turn on “Use my walking speed”. It stays on your iPhone.
        NSHealthShareUsageDescription: Publit reads your walking speed from Apple Health, only if you turn on “Use my walking speed”, so routes plan walks and changes at your pace. It stays on your iPhone.
        NSCameraUsageDescription: Publit uses the camera only when you choose to scan a paper ticket. The scan stays on your iPhone.
        NSCalendarsWriteOnlyAccessUsageDescription: Publit adds the trips you choose to your calendar.
        NSSupportsLiveActivities: true
        # Background check of saved lines for disruptions (LineAlertMonitor).
        BGTaskSchedulerPermittedIdentifiers: [io.github.publit.app.lines]
        UIBackgroundModes: [fetch]
        CFBundleURLTypes:
          - CFBundleURLName: io.github.publit.app
            CFBundleURLSchemes: [publit]
        # iOS Open In / Copy to Publit; no App Group or paid-team entitlement required.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Ticket PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Ticket image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        ITSAppUsesNonExemptEncryption: false
        # Contact sent in the User-Agent, required by the Transitous usage policy.
        PublitContact: https://github.com/elija-7580/Publit
        # Optional Google Places key for release builds (set GOOGLE_API_KEY as a build setting; empty otherwise).
        GoogleAPIKey: $(GOOGLE_API_KEY)
    # Apple Health: read the walking speed for smart routing (read only).
    entitlements:
      path: Config/Publit.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.publit.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: DeparturesWidget.swift
    preBuildScripts:
      # Icon PNGs are stored as base64 text in Config/AppIcon (see the README there).
      - name: Decode app icon
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Config/AppIcon/AppIcon.png.b64
          - $(SRCROOT)/Config/AppIcon/AppIcon-Dark.png.b64
          - $(SRCROOT)/Config/AppIcon/AppIcon-Tinted.png.b64
        outputFiles:
          - $(SRCROOT)/Sources/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          - $(SRCROOT)/Sources/App/Assets.xcassets/AppIcon.appiconset/AppIcon-Dark.png
          - $(SRCROOT)/Sources/App/Assets.xcassets/AppIcon.appiconset/AppIcon-Tinted.png
        script: |
          set -e
          SRC="$SRCROOT/Config/AppIcon"
          DST="$SRCROOT/Sources/App/Assets.xcassets/AppIcon.appiconset"
          for f in AppIcon AppIcon-Dark AppIcon-Tinted; do
            /usr/bin/base64 -D -i "$SRC/$f.png.b64" -o "$DST/$f.png"
          done
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - target: PublitWidgets
      - target: PublitShare
      # The watch app installs with the iPhone app (Embed Watch Content).
      - target: PublitWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
  PublitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/Shared
      # Shared with the app: API client, models and formatting for the departures widget.
      - Sources/API
      - Sources/App/AppInfo.swift
      - Sources/Models/TransitModels.swift
      - Sources/Models/ServiceAlerts.swift
      - Sources/Models/Fares.swift
      - Sources/Models/ModeStyle.swift
      - Sources/Models/RouteStyle.swift
      - Sources/Models/DeepLink.swift
      - Sources/Models/PlaceRole.swift
      - Sources/Models/TransitFilter.swift
      - Sources/Models/SmartRouting.swift
      - Sources/Models/TransitExtras.swift
      - Sources/Models/Reach.swift
      - Sources/Models/CircularLine.swift
      - Sources/Stores/StopGrouping.swift
      - Sources/Views/Components/LineBadge.swift
      - Sources/Util/Geo.swift
      - Sources/Util/Polyline.swift
      - Sources/Util/LineColors.swift
      - Sources/Util/Formatting.swift
      - Sources/Util/Palette.swift
      - Sources/Util/L10n.swift
      - Sources/Util/PerformanceTrace.swift
      # TransitousClient notes failed requests in the diagnostics (in the widget they stay in its own container).
      - Sources/Util/HangLog.swift
      - Sources/Util/MainThreadSampler.swift
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Publit
        PublitContact: https://github.com/elija-7580/Publit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.publit.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  PublitWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      # Shared with the app: API client, models, formatting, line badge and direction label.
      - Sources/Shared/DirectionLabel.swift
      - Sources/Shared/Localizable.xcstrings
      - Sources/API
      - Sources/App/AppInfo.swift
      - Sources/Models/TransitModels.swift
      - Sources/Models/ServiceAlerts.swift
      - Sources/Models/Fares.swift
      - Sources/Models/ModeStyle.swift
      - Sources/Models/RouteStyle.swift
      - Sources/Models/DeepLink.swift
      - Sources/Models/PlaceRole.swift
      - Sources/Models/TransitFilter.swift
      - Sources/Models/SmartRouting.swift
      - Sources/Models/TransitExtras.swift
      - Sources/Models/Reach.swift
      - Sources/Models/CircularLine.swift
      - Sources/Stores/StopGrouping.swift
      - Sources/Views/Components/LineBadge.swift
      - Sources/Util/Geo.swift
      - Sources/Util/Polyline.swift
      - Sources/Util/LineColors.swift
      - Sources/Util/Formatting.swift
      - Sources/Util/Palette.swift
      - Sources/Util/L10n.swift
      - Sources/Util/PerformanceTrace.swift
      - Sources/Util/HangLog.swift
      - Sources/Util/MainThreadSampler.swift
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: Publit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.github.publit.app
        NSLocationWhenInUseUsageDescription: Publit uses your location to show departures near you.
        PublitContact: https://github.com/elija-7580/Publit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.publit.app.watchkitapp
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      # Same icon as the iPhone app, decoded from Config/AppIcon (see the README there).
      - name: Decode app icon
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Config/AppIcon/AppIcon.png.b64
        outputFiles:
          - $(SRCROOT)/Watch/Assets.xcassets/AppIcon.appiconset/AppIcon.png
        script: |
          set -e
          /usr/bin/base64 -D -i "$SRCROOT/Config/AppIcon/AppIcon.png.b64" -o "$SRCROOT/Watch/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
  PublitShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Sources/Models/MapLink.swift
      - Sources/Util/L10n.swift
      - Sources/Shared/Localizable.xcstrings
    info:
      path: Config/Share-Info.plist
      properties:
        CFBundleDisplayName: Publit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.publit.app.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  PublitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "UI/**"
    dependencies:
      - target: Publit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PublitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Publit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Publit
schemes:
  Publit:
    build:
      targets:
        Publit: all
        PublitTests: [test]
        PublitUITests: [test]
    test:
      targets:
        - PublitTests
        - PublitUITests
