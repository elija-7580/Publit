name = "publit-ticket-shop"
main = "src/index.js"
compatibility_date = "2024-10-01"

[vars]
# Production: https://api.distribusion.com/retailers/v4 (default is the demo environment).
DISTRIBUSION_BASE_URL = "https://api.demo.distribusion.com/retailers/v4"
# "on" only for testing with Stripe test keys: made-up tickets for every leg.
DEMO_PROVIDER = "off"
# Publit's affiliate tracking links for the open link layer (/v1/links, /v1/partners), as JSON:
# { "<program id>": "<tracking link with {url}>" }. Program ids: db, flixbus, trainline, omio, sncf, eurostar.
# e.g. { "flixbus": "https://www.awin1.com/cread.php?awinmid=<advertiser>&awinaffid=<your id>&ued={url}" }
# Empty = links stay as they are. Changing this needs no app update.
PARTNER_TEMPLATES = "{}"
# Own routing server for /v1/journeys (services/routing), e.g. "https://route.example.org". Empty = /v1/journeys
# answers 503. Transitous' public API is refused here: it may not be used commercially.
ROUTER_URL = ""

# Secrets (wrangler secret put …): TOKEN_SECRET (32+ random characters), STRIPE_SECRET_KEY,
# DISTRIBUSION_API_KEY. A provider without its key is skipped.

# Basic abuse protection: requests per minute per client IP (Cloudflare Rate Limiting binding).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
