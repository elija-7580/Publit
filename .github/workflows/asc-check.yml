name: App Store check
on:
  push:
    branches: [asc-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pyjwt cryptography requests && python3 asc_check.py
      - if: always()
        run: |
          mkdir r && cp check.txt r/ 2>/dev/null || echo none > r/check.txt; cd r
          git init -q -b asc-check-report && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m report && git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" asc-check-report
