name: Device screenshots 59

# One-off: builds with the Xcode 27 SDK and takes the design screenshots on iPhone, iPad and
# iPhone Duo (where the simulator exists), then commits them to the shots-59 branch for review.
on:
  push:
    branches: [build59]

permissions:
  contents: write

concurrency:
  group: shots59
  cancel-in-progress: true

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and simulators
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          mkdir -p out
          { xcodebuild -version; sw_vers; xcrun simctl list devicetypes; xcrun simctl list runtimes; xcrun simctl list devices available; } > out/env.txt 2>&1
          ls -d /Applications/Xcode*.app >> out/env.txt
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Publit.xcodeproj -scheme Publit \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/build-full.log | grep -E ": (error|warning):|BUILD" > out/build.log || true
          grep -q "TEST BUILD SUCCEEDED" out/build-full.log
      - name: Screenshots
        if: always()
        run: |
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(sorted(r,key=lambda x:[int(p) for p in x['version'].split('.')])[-1]['identifier'])")
          for want in "iPhone Duo" "iPad Pro 13-inch"; do
            TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; w=sys.argv[1]; t=[d for d in json.load(sys.stdin)['devicetypes'] if d['name'].startswith(w)]; print(t[-1]['identifier'] if t else '')" "$want")
            [ -z "$TYPE" ] && { echo "no device type $want" >> out/env.txt; continue; }
            UDID=$(xcrun simctl create "shots-$want" "$TYPE" "$RT")
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
            xcrun simctl location "$UDID" set 48.15000,11.58030
            xcrun simctl privacy "$UDID" grant location io.github.elija7580.publit || true
            rm -rf ~/publit-shots
            xcodebuild test-without-building -project Publit.xcodeproj -scheme Publit \
              -destination "id=$UDID" -derivedDataPath build \
              -only-testing:PublitUITests/PublitUITests/testF22StartScreens \
              -only-testing:PublitUITests/PublitUITests/testF21DesignScreens 2>&1 | grep -E "Test Case|error:|Executed" > "out/ui-$want.log" || true
            D="out/$(echo "$want" | tr ' ' '-')"
            mkdir -p "$D"
            for f in ~/publit-shots/*.png; do [ -f "$f" ] && sips -Z 1100 "$f" --out "$D/$(basename "$f")" >/dev/null; done
            xcrun simctl shutdown "$UDID" || true
          done
      - name: Publish
        if: always()
        run: |
          rm -f out/build-full.log
          cd out
          git init -q -b shots-59
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Screenshots for build 59 ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" shots-59
