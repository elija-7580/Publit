name: Release build 58

# One-off: tags the build 58 merge on main and starts the TestFlight upload (the GitHub connector
# cannot create tags). Removed again right after.
on:
  push:
    branches: [release-58]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Tag and start TestFlight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout 3062bb154a556583346dcbf23a06f8435b205270
          grep -q "CURRENT_PROJECT_VERSION: 58" project.yml || grep -q "CURRENT_PROJECT_VERSION: \"58\"" project.yml
          git tag v0.6.0-58 3062bb154a556583346dcbf23a06f8435b205270
          git push origin v0.6.0-58
          gh workflow run testflight.yml --ref v0.6.0-58 -R "$GITHUB_REPOSITORY"
