# Files new wishes from publit.eu/wuensche as issues here (label "wish"), with this workflow's own
# token: no personal token, nothing secret on the wish server. Spam rules in
# tools/wishes/wishes_to_issues.py (24 h old, 2 votes, at most 5 per run). publit-site's wishes sync
# then links each issue to its wish, so the status on publit.eu follows the issue's labels.
# Optional repository variables: WISHES_ISSUE_MIN_VOTES, WISHES_ISSUE_MIN_HOURS.
name: Wishes to issues
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency: wishes-to-issues
permissions:
  issues: write
jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/wishes
      - run: python3 tools/wishes/test_wishes_to_issues.py
      - name: File new wishes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WISHES_ISSUE_MIN_VOTES: ${{ vars.WISHES_ISSUE_MIN_VOTES }}
          WISHES_ISSUE_MIN_HOURS: ${{ vars.WISHES_ISSUE_MIN_HOURS }}
        run: python3 tools/wishes/wishes_to_issues.py
