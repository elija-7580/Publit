name: ASC Duo screenshots
on:
  push:
    branches: [ascduo]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pyjwt cryptography requests pillow && python3 .duo/duo_upload.py
      - name: Report
        if: always()
        run: |
          test -f report.txt || echo "no report" > report.txt
          mkdir r && cp report.txt r/ && cd r && git init -q -b ascduo-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Duo upload report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" ascduo-report
