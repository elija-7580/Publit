name: Apply build 58 strings

# One-off: the string catalog is too large to upload through the GitHub connector, so this merges
# the small change file into it on the build58 branch. Removed again right after.
on:
  push:
    branches: [build58]
    paths: [ci/strings-build58.json]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: build58 }
      - name: Merge strings
        run: |
          python3 - <<'PY'
          import json
          p = "Sources/Shared/Localizable.xcstrings"
          cat = json.load(open(p, encoding="utf-8"))
          delta = json.load(open("ci/strings-build58.json", encoding="utf-8"))
          for k in delta["remove"]:
              cat["strings"].pop(k, None)
          cat["strings"].update(delta["set"])
          open(p, "w", encoding="utf-8").write(json.dumps(cat, ensure_ascii=False, separators=(",", ":"), sort_keys=True))
          PY
          git rm -q ci/strings-build58.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Shared/Localizable.xcstrings
          git commit -m "Build 58: strings for search.ch and VRR"
          git push origin HEAD:build58
