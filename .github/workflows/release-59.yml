name: Release 59

on:
  push:
    branches: [release-59]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git tag v0.6.0-59 3bb9c112498d1413f58c3770f31a692cb5e44bd9
          git push origin v0.6.0-59
          gh workflow run testflight.yml --ref v0.6.0-59
        env:
          GH_TOKEN: ${{ github.token }}
