name: Duo chrome assets

on:
  push:
    branches: [chromeduo]

permissions:
  contents: write

jobs:
  find:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Find device chrome
        shell: bash {0}
        run: |
          mkdir -p out/chrome
          D="/Library/Developer/CoreSimulator/Profiles/DeviceTypes/iPhone Duo.simdevicetype"
          find "$D" > out/list2.txt 2>&1
          ls -la /Library/Developer/DeviceKit/Chrome >> out/list2.txt 2>&1
          for c in /Library/Developer/DeviceKit/Chrome/*.devicechrome; do echo "$c: $(find "$c" -type f | wc -l) files, $(du -sh "$c" | cut -f1)" >> out/list2.txt; done
          cp -R "$D/Contents/Resources" out/chrome/simdevicetype-resources 2>/dev/null
          cp "$D/Contents/Resources/profile.plist" out/chrome/ 2>/dev/null
          grep -rl -i -E "duo|fold" /Library/Developer/DeviceKit/Chrome 2>/dev/null >> out/list2.txt
          plutil -p "$D/Contents/Resources/profile.plist" 2>/dev/null | grep -i -E "chrome|screen|width|height|scale" >> out/list2.txt
          for c in phone14 phone15; do
            du -sh /Library/Developer/DeviceKit/Chrome/$c.devicechrome >> out/list2.txt
            cp -R /Library/Developer/DeviceKit/Chrome/$c.devicechrome out/chrome/ 2>/dev/null
          done
          find out/chrome -type f | head -200 >> out/list2.txt
      - name: Publish
        if: always()
        run: |
          cd out
          git init -q -b chrome-duo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Duo chrome"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" chrome-duo
