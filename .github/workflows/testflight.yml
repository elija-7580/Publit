name: TestFlight

# Every build tag (v0.6.0-N) is archived, signed in the cloud with the App Store Connect API key
# and uploaded to TestFlight. No Mac needed. Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (Admin key).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$KEY_ID" && test -n "$ISSUER_ID" && test -n "$P8" || { echo "::error::Secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 are required"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          # Xcode 16+ looks for downloaded profiles here; on a fresh runner the folder is missing.
          # One folder for both places, whichever this Xcode downloads into and reads from.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          ln -s "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Keychain and Apple intermediates
        run: |
          # An unlocked default keychain for the certificates Xcode creates, plus Apple's current
          # intermediate certificates: without them the signature does not verify ("Invalid Signature").
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          for c in AppleWWDRCAG3 AppleWWDRCAG6; do
            curl -fsSL "https://www.apple.com/certificateauthority/$c.cer" -o "$RUNNER_TEMP/$c.cer"
            security import "$RUNNER_TEMP/$c.cer" -k "$KC" -T /usr/bin/codesign || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null 2>&1 || true
      - name: Distribution certificate and profiles
        env:
          P12: ${{ secrets.DIST_P12 }}
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          PROFILE_WIDGETS: ${{ secrets.PROFILE_WIDGETS }}
          PROFILE_WATCH: ${{ secrets.PROFILE_WATCH }}
          PROFILE_SHARE: ${{ secrets.PROFILE_SHARE }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          mkdir -p "$RUNNER_TEMP/profiles"
          echo "$PROFILE_APP" | base64 --decode > "$RUNNER_TEMP/profiles/app.mobileprovision"
          echo "$PROFILE_WIDGETS" | base64 --decode > "$RUNNER_TEMP/profiles/widgets.mobileprovision"
          echo "$PROFILE_WATCH" | base64 --decode > "$RUNNER_TEMP/profiles/watch.mobileprovision"
          echo "$PROFILE_SHARE" | base64 --decode > "$RUNNER_TEMP/profiles/share.mobileprovision"
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Apple Distribution" | head -1 | awk '{print $2}')
          test -n "$ID" || { echo "::error::Distribution identity missing"; exit 1; }
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project Publit.xcodeproj -scheme Publit -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Publit.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -30; exit 1; }
          echo "Archived"
      - name: Sign and upload
        run: |
          python3 scripts/ci-sign.py "$RUNNER_TEMP/Publit.xcarchive/Products/Applications/Publit.app" \
            "$RUNNER_TEMP/profiles" "$SIGN_ID" "$RUNNER_TEMP/Publit.ipa"
          mkdir -p "$HOME/private_keys" && cp "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" "$HOME/private_keys/"
          xcrun altool --upload-app -f "$RUNNER_TEMP/Publit.ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          # altool can exit 0 after a failed validation.
          grep -q "UPLOAD SUCCEEDED" "$RUNNER_TEMP/upload.log"
      - name: Clean up key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/keys/"*.p8 "$HOME/private_keys/"*.p8
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
