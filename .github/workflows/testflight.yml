name: TestFlight

# Every build tag (v0.6.0-N) is archived, signed in the cloud with the App Store Connect API key
# and uploaded to TestFlight. No Mac needed. Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (Admin key).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$KEY_ID" && test -n "$ISSUER_ID" && test -n "$P8" || { echo "::error::Secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 are required"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          # Xcode 16+ looks for downloaded profiles here; on a fresh runner the folder is missing.
          # One folder for both places, whichever this Xcode downloads into and reads from.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          ln -s "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Keychain and Apple intermediates
        run: |
          # An unlocked default keychain for the certificates Xcode creates, plus Apple's current
          # intermediate certificates: without them the signature does not verify ("Invalid Signature").
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          for c in AppleWWDRCAG3 AppleWWDRCAG6; do
            curl -fsSL "https://www.apple.com/certificateauthority/$c.cer" -o "$RUNNER_TEMP/$c.cer"
            security import "$RUNNER_TEMP/$c.cer" -k "$KC" -T /usr/bin/codesign || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null 2>&1 || true
      - name: Archive
        run: |
          # A fresh profile is sometimes created but not yet downloadable (seen for the share extension):
          # the next attempt picks it up.
          for attempt in 1 2 3; do
            set +e
            xcodebuild archive -project Publit.xcodeproj -scheme Publit -configuration Release \
              -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Publit.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
              -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
              > "$RUNNER_TEMP/archive.log" 2>&1
            code=$?
            set -e
            if [ $code -eq 0 ] && [ -d "$RUNNER_TEMP/Publit.xcarchive" ]; then
              echo "Archived (attempt $attempt)"
              security find-identity -v -p codesigning || true
              codesign -dvv "$RUNNER_TEMP/Publit.xcarchive/Products/Applications/Publit.app" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier" || true
              codesign --verify --deep --strict "$RUNNER_TEMP/Publit.xcarchive/Products/Applications/Publit.app" && echo "Signature verifies" || true
              break
            fi
            echo "::warning::Archive attempt $attempt failed"
            grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -20
            rm -rf "$RUNNER_TEMP/Publit.xcarchive"
            [ $attempt -eq 3 ] && exit 1
            sleep 20
          done
      - name: Upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>3D6S8GFSGK</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Publit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/keys/"*.p8
