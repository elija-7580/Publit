name: App Store screenshots
on:
  push:
    branches: [appstore2]
permissions:
  contents: write
concurrency:
  group: appstore-shots2
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
        lang: [en, de]
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          mkdir -p out
          xcodebuild -version > out/env.txt
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild build-for-testing -project Publit.xcodeproj -scheme Publit \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > out/build-full.log 2>&1
      - name: Screenshots
        env:
          SHOT_DEVICE: ${{ matrix.device }}
          SHOT_LANG: ${{ matrix.lang }}
        shell: bash {0}
        run: |
          set -e
          if [ "$SHOT_DEVICE" = iphone ]; then WANT="iPhone 17 Pro Max"; else WANT="iPad Pro 13-inch (M5)"; fi
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; w=sys.argv[1]; t=[d for d in json.load(sys.stdin)['devicetypes'] if d['name']==w]; print(t[-1]['identifier'])" "$WANT")
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(sorted(r,key=lambda x:[int(p) for p in x['version'].split('.')])[-1]['identifier'])")
          export UDID=$(xcrun simctl create "appstore-$SHOT_DEVICE-$SHOT_LANG" "$TYPE" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl location "$UDID" set 48.15000,11.58030
          rm -rf ~/publit-shots
          export TEST_RUNNER_PUBLIT_SHOT_LANG="$SHOT_LANG"
          python3 - <<'PY'
          import os, signal, subprocess
          args=['xcodebuild','test-without-building','-project','Publit.xcodeproj','-scheme','Publit','-destination','id='+os.environ['UDID'],'-derivedDataPath','build','-parallel-testing-enabled','NO','-test-timeouts-enabled','YES','-default-test-execution-time-allowance','600','-maximum-test-execution-time-allowance','600','-only-testing:PublitUITests/PublitUITests/testF29AppStoreShots']
          with open('out/test-full.log','w') as log:
              p=subprocess.Popen(args,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try: p.wait(timeout=900)
              except subprocess.TimeoutExpired:
                  os.killpg(p.pid, signal.SIGTERM)
                  try: p.wait(timeout=20)
                  except subprocess.TimeoutExpired: os.killpg(p.pid,signal.SIGKILL); p.wait()
                  print('External 900-second test timeout')
              print('xcodebuild exit:',p.returncode)
          PY
      - name: Publish
        if: always()
        env:
          SHOT_DEVICE: ${{ matrix.device }}
          SHOT_LANG: ${{ matrix.lang }}
        run: |
          mkdir -p out
          if [ "$SHOT_DEVICE" = iphone ]; then D="out/iPhone-17-Pro-Max/$SHOT_LANG"; else D="out/iPad-Pro-13-inch-M5/$SHOT_LANG"; fi
          mkdir -p "$D"
          for f in ~/publit-shots/*.png; do [ -f "$f" ] || continue; cp "$f" "$D/"; done
          for f in out/*full.log; do [ -f "$f" ] || continue; tail -300 "$f" > "$f.tail"; rm "$f"; done
          echo "source=$GITHUB_SHA device=$SHOT_DEVICE lang=$SHOT_LANG" >> out/env.txt
          find "$D" -name '*.png' | sort >> out/env.txt
          cd out
          BRANCH="appstore-shots2-$SHOT_DEVICE-$SHOT_LANG"
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Official-frame source screenshots ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" "$BRANCH"
