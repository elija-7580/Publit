name: App Store screenshots

# One-off: full-resolution App Store screenshots (iPhone 6.9", iPad 13"), English and German,
# committed to the appstore-shots branch.
on:
  push:
    branches: [appstore2]

permissions:
  contents: write

concurrency:
  group: appstore-shots2
  cancel-in-progress: true

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          mkdir -p out
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild build-for-testing -project Publit.xcodeproj -scheme Publit \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/build-full.log | grep -E ": (error|warning):|BUILD" > out/build.log || true
          grep -q "TEST BUILD SUCCEEDED" out/build-full.log
      - name: Screenshots
        shell: bash {0}
        run: |
          for want in "iPhone 17 Pro Max" "iPad Pro 13-inch (M5)"; do
            TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; w=sys.argv[1]; t=[d for d in json.load(sys.stdin)['devicetypes'] if d['name']==w]; print(t[-1]['identifier'] if t else '')" "$want")
            RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(sorted(r,key=lambda x:[int(p) for p in x['version'].split('.')])[-1]['identifier'])")
            UDID=$(xcrun simctl create "as-$want" "$TYPE" "$RT") || { echo "create failed $want" >> out/env.txt; continue; }
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl location "$UDID" set 48.15000,11.58030
            xcrun simctl privacy "$UDID" grant location io.github.elija7580.publit || true
            for lang in en de; do
              D="out/$(echo "$want" | tr -d '()' | tr ' ' '-')/$lang"
              mkdir -p "$D"
              for attempt in 1 2 3; do
                rm -rf ~/publit-shots
                TEST_RUNNER_PUBLIT_SHOT_LANG=$lang xcodebuild test-without-building -project Publit.xcodeproj -scheme Publit \
                  -destination "id=$UDID" -derivedDataPath build \
                  -only-testing:PublitUITests/PublitUITests/testF29AppStoreShots > "out/full-$want-$lang-$attempt.log" 2>&1 || true
                tail -60 "out/full-$want-$lang-$attempt.log" > "out/ui-$want-$lang-$attempt.log.tail"
                rm -f "out/full-$want-$lang-$attempt.log"
                for f in ~/publit-shots/*.png; do [ -f "$f" ] || continue; b=$(basename "$f"); [ -f "$D/$b" ] || cp "$f" "$D/"; done
                n=$(ls "$D"/as-0*.png 2>/dev/null | wc -l)
                echo "$want $lang attempt $attempt: $n shots" >> out/env.txt
                if [ "$n" -ge 8 ]; then break; fi
              done
            done
            xcrun simctl shutdown "$UDID" || true
          done
      - name: Publish
        if: always()
        run: |
          rm -f out/build-full.log
          cd out
          git init -q -b appstore-shots2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "App Store screenshots ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" appstore-shots2
